name: hygiene

# Every push, on every branch. A real balance in an unmerged branch of a public
# repository is still published, and cannot be un-published by force-pushing.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-personal-data:
    name: Constitution IX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, pinned by SHA (M-27)
        with:
          fetch-depth: 0

      - name: Scan the pushed range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "new branch - scanning every tracked file"
            python3 scripts/hygiene.py --all
            exit $?
          elif ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            # A force-push (a rebase, e.g. `@dependabot rebase`): the previous head was
            # discarded, so it is not in this clone and before..sha cannot be diffed - git
            # exits 128 and the scan never runs. Scan everything instead, as for a new branch.
            echo "previous head ${{ github.event.before }} not found (force-push) - scanning every tracked file"
            python3 scripts/hygiene.py --all
            exit $?
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "scanning $RANGE"
          python3 scripts/hygiene.py --range "$RANGE"
