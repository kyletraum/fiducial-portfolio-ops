# Keeps the pins current. Actions are pinned by commit SHA (M-27) and packages by exact
# version, so nothing moves on its own: Dependabot proposes each update as a PR, and the
# ci workflow decides whether it is safe to merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # MessagePack is pinned only to lift Aspire's TRANSITIVE copy past GHSA-qhrr-8q5h-9q3h.
      # Aspire.Hosting and StreamJsonRpc are built against MessagePack 2.5.x; 3.x is a major
      # with breaking API changes, so forcing it under them risks runtime failures in the
      # AppHost backchannel (#38, #42). Lift when Aspire itself depends on MessagePack 3.
      - dependency-name: MessagePack
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the test framework across all five test projects, not one per project
      # (#39 and its per-project duplicates #40, #41, #43).
      xunit:
        patterns: ["xunit*"]
      # Released together and versioned together; one PR, not a dozen.
      aspire:
        patterns: ["Aspire.*"]
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql*", "EFCore.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript (which generates web/src/api/schema.d.ts) requires TypeScript 5;
      # TypeScript 7 fails `npm ci` with ERESOLVE (seen in #20). Lift when openapi-typescript
      # supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Type definitions must match the Node major we run (24: ci.yml and the dev machine).
      # Newer majors would type APIs the runtime does not have. Lift with the Node upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # React and React DOM must move together: react-dom declares a peer dependency on its
      # own react version and checks at startup that the two match exactly. Separate PRs
      # (#32 and #33) conflicted with each other, and landing either alone would have left
      # main mismatched - a page that builds but throws "Incompatible React versions".
      react:
        patterns: ["react", "react-dom"]
      dev-tooling:
        dependency-type: development
