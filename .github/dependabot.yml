# Keeps the pins current. Actions are pinned by commit SHA (M-27) and packages by exact
# version, so nothing moves on its own: Dependabot proposes each update as a PR, and the
# ci workflow decides whether it is safe to merge.
#
# One PR per ecosystem per week for minor and patch updates. Separate PRs overlapped and
# rebased each other after every merge: #90, #91 and #98 were all the .NET 10.0.14
# servicing release, split by groups whose patterns crossed. A dependency goes to the
# FIRST group it matches, so the minor-and-patch group comes first and the groups after it
# catch majors only. A major that matches no group gets a PR of its own: majors are what
# break (TypeScript 7 in #20, MessagePack 3 in #38), and one at a time says which did.
# Security updates are not grouped here, so they still arrive one at a time, at once.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # MessagePack is pinned only to lift Aspire's TRANSITIVE copy past GHSA-qhrr-8q5h-9q3h.
      # Aspire.Hosting and StreamJsonRpc are built against MessagePack 2.5.x; 3.x is a major
      # with breaking API changes, so forcing it under them risks runtime failures in the
      # AppHost backchannel (#38, #42). Lift when Aspire itself depends on MessagePack 3.
      - dependency-name: MessagePack
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Majors. Each of these families is released and versioned together, so its major is
      # one PR, not a dozen; xunit's also spans all five test projects (#39-#43).
      dotnet:
        patterns: ["Microsoft.*", "Npgsql*", "EFCore.*"]
        update-types: ["major"]
      aspire:
        patterns: ["Aspire.*"]
        update-types: ["major"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
        update-types: ["major"]
      xunit:
        patterns: ["xunit*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # openapi-typescript (which generates web/src/api/schema.d.ts) requires TypeScript 5;
      # TypeScript 7 fails `npm ci` with ERESOLVE (seen in #20). Lift when openapi-typescript
      # supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Type definitions must match the Node major we run (24: ci.yml and the dev machine).
      # Newer majors would type APIs the runtime does not have. Lift with the Node upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # React and React DOM must move together: react-dom declares a peer dependency on its
      # own react version and checks at startup that the two match exactly. Separate PRs
      # (#32 and #33) conflicted with each other, and landing either alone would have left
      # main mismatched - a page that builds but throws "Incompatible React versions".
      # Their minors and patches already travel together in the group above.
      react:
        patterns: ["react", "react-dom"]
        update-types: ["major"]
